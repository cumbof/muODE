# =============================================================================
# metagenomics/ pipeline configuration
# =============================================================================
# Paths may be absolute or relative to the directory you launch snakemake from
# (recommended: this metagenomics/ directory). Reference-database paths are left
# blank -- fill them in for the tracks you enable (see README.md "Reference
# databases"). Rules whose DB is unset will fail fast with a clear message.

# --- inputs / outputs -------------------------------------------------------
# Sample sheet: TSV with header `sample<TAB>r1<TAB>r2`. Generate it from a run
# directory with:  python scripts/make_samplesheet.py <fastq_dir> > config/samples.tsv
samples: "config/samples.tsv"
outdir: "results"

# --- Phase 0: QC ------------------------------------------------------------
min_read_len: 50            # fastp: drop reads shorter than this after trimming
remove_host: false         # true -> bowtie2-filter reads against `host_index`
host_index: ""             # bowtie2 index PREFIX for the host (e.g. human GRCh38)

# --- Phase 1: assembly ------------------------------------------------------
assembler: "megahit"       # megahit (fast, low-mem; default) | metaspades (higher-mem)
min_contig_len: 1000       # discard contigs shorter than this before binning
spades_mem_gb: 250         # metaspades only: memory cap (GB)

# --- Phase 2: binning -------------------------------------------------------
# Any subset may be enabled; DAS_Tool consolidates whatever ran. >=2 recommended.
binners:
  metabat2: true
  maxbin2: true
  concoct: true
min_bin_size: 200000       # DAS_Tool score_threshold applies; this is a sanity floor

# --- Phase 3: prokaryotic MAG quality gate (CheckM2) ------------------------
min_completeness: 50.0     # keep MAGs with completeness >= this
max_contamination: 10.0    # ...and contamination <= this
checkm2_db: ""             # CheckM2 diamond DB (uniref100.KO...). Blank -> CheckM2's default path.

# --- Phase 4: dereplication WITHIN each sample (dRep) -----------------------
# Samples are never pooled: each is its own community (in a case/control design,
# its own patient). dRep here only collapses near-identical bins recovered by the
# binning ensemble within one sample.
derep_ani: 0.95            # secondary ANI threshold (0.95 ~ species-level clusters)

# --- Phase 5: prokaryotic taxonomy (GTDB-Tk) --------------------------------
# Also supplies the GTDB species that joins a MAG to its MetaPhlAn SGB, so this
# is required whenever run_profiling is true.
classify_gtdbtk: true
gtdbtk_db: ""              # GTDB-Tk reference data dir (GTDBTK_DATA_PATH). Required if classify_gtdbtk.

# --- Phase 6: eukaryote recovery (Tiara -> binning -> EukCC) ----------------
# Optional and lower-yield than the prokaryotic track (honest caveat -- see README).
recover_eukaryotes: false
euk_min_contig_len: 5000   # euk contigs are large; bin only long ones
eukcc_db: ""               # EukCC2 database dir. Required if recover_eukaryotes.
eukcc_min_completeness: 50.0
eukcc_max_contamination: 10.0

# --- Phase 7: virus / phage detection (geNomad -> CheckV) -------------------
detect_viruses: true
genomad_db: ""             # geNomad database dir. Required if detect_viruses.
checkv_db: ""              # CheckV database dir. Required if detect_viruses.

# --- Phase 7: quantitative profiling (MetaPhlAn4) ---------------------------
# Entirely OPTIONAL. Profiles each sample's reads against MetaPhlAn4's SGB
# database, which covers UNCHARACTERISED taxa as uSGBs. Its job is DISCOVERY: it
# reveals which species are present that assembly failed to recover. It never
# supplies abundances to muODE -- CoverM does all quantification (see Phase 8).
# Requires classify_gtdbtk (the GTDB species is the join key).
run_profiling: false       # true -> MetaPhlAn4 + reconstructed-vs-profiled reconciliation
metaphlan_db: ""           # ChocoPhlAn SGB bowtie2 DB dir. Required if run_profiling.
metaphlan_index: ""        # pin an index, e.g. mpa_vJun23_CHOCOPhlAnSGB_202403 (blank -> latest in db)
metaphlan_sgb2gtdb: ""     # override the SGB->GTDB table (blank -> *_SGB2GTDB.tsv in metaphlan_db)

# --- Phase 7c: reference genomes for profiled-but-unassembled taxa ----------
# For each species the profiler saw but assembly never recovered, fetch a public
# NCBI genome of that species so muODE can simulate it. This EXPANDS the community
# rather than dropping those taxa. Requires run_profiling.
#
# The fetched genome is a PROXY: a reference isolate of the species, not the strain
# actually in the sample. Every one is flagged `source=reference` in
# genome_sources.tsv and reconciliation.tsv. Needs network access on the node.
fetch_missing_genomes: false
gtdb_taxonomy: ""          # gtdb_taxonomy.tsv (blank -> <gtdbtk_db>/taxonomy/gtdb_taxonomy.tsv)
reference_min_abundance: 0.1   # skip profiled species below this MetaPhlAn %
max_reference_genomes: 50      # cap per sample; 0 = no cap

# --- Phase 8: abundance (CoverM) --------------------------------------------
# CoverM is run ONCE, over the FINAL genome set (MAGs + fetched references), so
# there is exactly one abundance table with one denominator. CoverM and MetaPhlAn
# percentages are never merged -- a read fraction and a marker-normalised cell
# fraction are different quantities.

# --- resources (overridable per-rule in profiles/slurm/config.yaml) ---------
threads: 16

# Local (non-NFS) scratch base for tools that break on a networked $TMPDIR.
# CheckM2's multiprocessing cleanup fails with EBUSY when $TMPDIR is on NFS
# (e.g. an isilon mount); leave blank to use $SLURM_TMPDIR or /tmp, or set an
# explicit node-local path with enough space.
local_tmp: ""
