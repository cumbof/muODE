# Top-level muODE environment for the core engine + CLI + workflow driver.
# External per-phase tools (CarveMe, CheckM2, gapseq) live in their own envs
# under workflow/envs/ and are provisioned by Snakemake with `--use-conda`.
#
#   mamba env create -f environment.yml
#   conda activate muode
#   pip install -e .
name: muode
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - cobra>=0.29
  - numpy>=1.23
  - scipy>=1.10
  - pandas>=1.5
  - networkx>=3.0
  - matplotlib>=3.6
  - pyyaml>=6.0
  - typer>=0.9
  - rich>=13.0
  - highspy            # free, fast LP solver (default)
  - pyrodigal          # optional pure-Python gene caller
  - biopython
  - snakemake-minimal>=8.0
  - pytest>=7.0
  - pip
