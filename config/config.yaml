# muODE pipeline configuration.
# Mirrors muode.config.PipelineConfig. Paths are relative to the repo root.

# --- inputs / outputs ------------------------------------------------------
mags_dir: "data/raw_mags"     # directory of MAG FASTA files
mag_extension: "fna"          # extension (without dot) of the MAG files
abundance: null               # path to an abundance TSV (or null)
metasbt: false                # parse `abundance` as a MetaSBT profile (auto-detect columns)
outdir: "results"

# --- Phase 0: MAG quality gate --------------------------------------------
# CheckM2 is always part of the pipeline (rule `checkm2`) but is gated by this
# flag. It is OFF by default because it cannot run on every architecture (e.g.
# aarch64); turn it on (`run_checkm2: true`) on a capable machine to gate MAGs.
run_checkm2: false
min_completeness: 50.0
max_contamination: 10.0

# --- Phase 1: reconstruction ----------------------------------------------
# carveme (default, BiGG namespace) is the production engine. `stub` produces
# dependency-free placeholder models for validating the workflow locally -- see
# config/config.demo.yaml. gapseq (ModelSEED) is available via `muode build`.
engine: "carveme"
universe: "bacteria"          # CarveMe universe / template
gapfill_media: null           # e.g. "M9" to gap-fill during reconstruction

# --- Phase 2/3: refinement -------------------------------------------------
universal_model: null         # SBML universal model for LP gap-filling (optional)
run_memote: false             # set true for full per-model memote QC reports
# Kinetics refinement (Phase 3). predict_kinetics writes per-MAG {stem}.kinetics.json
# (Km for uptake + kcat for enzyme constraints). The 'heuristic' predictor needs no
# deps; 'dlkcat'/'km-ml' need the 'ml' extra. enzyme_constraints applies GECKO-lite
# kcat caps to intracellular reactions at simulation time.
predict_kinetics: false
predictor: "heuristic"        # heuristic | dlkcat | km-ml
enzyme_constraints: false
default_vmax: 10.0
default_km: 0.01

# --- Phase 4: simulation ---------------------------------------------------
diet: "western_gut"           # preset name or path to a diet CSV
total_biomass: 0.01
t_end: 24.0
dt: 0.1

# --- scale: abundance-aware subsampling for very large communities ---------
# (any combination; all null = simulate every passing MAG)
max_species: null             # keep only the N most abundant MAGs
min_abundance: null           # drop MAGs below this relative abundance (0-1)
abundance_coverage: null      # keep top MAGs reaching this cumulative abundance (e.g. 0.95)

# --- Phase 6: validation (optional) ----------------------------------------
benchmark: null               # path to a benchmark expectation YAML (examples/benchmarks/)

# --- compute ---------------------------------------------------------------
threads: 4

# --- Phase 5: perturbation (optional) -------------------------------------
# Provide a mapping to additionally run the perturbation arm, e.g.:
# perturbation:
#   target_pathway: "Folate Biosynthesis"
#   efficacy: 0.95
#   # remove_species: "Bin.42"
#   # knockout: "FOLD,DHFR"
perturbation: null
