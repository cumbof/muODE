# Benchmark expectation for the 12-species western gut community example.
# Produced by:
#   muode validate --results examples/gut_western/results \
#                  --expected examples/gut_western/benchmark.yaml
#
# NAMESPACE: ModelSEED (gapseq).  The community is gapseq-reconstructed, so metabolite
# ids are cpd* (cpd00027 glucose, cpd00029 acetate, cpd00211 butyrate), not BiGG.
#
# STATUS: these are the QUALITATIVE ecological target (Bacteroides dominance, an
# acetate->butyrate cross-feeding chain), NOT yet reconciled with a real run -- only 3
# of the 12 GEMs are reconstructed, so the community has never been simulated end to
# end.  The exact abundance/metabolite targets and tolerances MUST be refreshed against
# examples/gut_western/results/ once the workstation has built all 12 GEMs and run it.
# Tolerances are intentionally generous: GEM quality varies with the gapseq/DB version,
# and the translated colonic medium is still incomplete.
name: western_gut_12sp

# --- expected community composition at simulation end ----------------------
# Bacteroides should remain dominant on the sugar-rich western diet; butyrate producers
# persist by cross-feeding on primary-fermenter acetate/succinate.
relative_abundances:
  B_thetaiotaomicron_VPI5482: 0.25
  B_fragilis_NCTC9343: 0.14
  E_rectale_ATCC33656: 0.10
  B_longum_NCC2705: 0.07

# --- expected metabolite concentrations at simulation end (mmol/L) ----------
# Glucose largely consumed; acetate the primary fermentation product and cross-feeding
# shuttle (nonzero pool, not all consumed downstream); butyrate the terminal product of
# the cross-feeding chain -- the arm that REQUIRES gapseq (CarveMe cannot make it).
metabolites:
  cpd00027_e0: 2.0        # glucose -- mostly consumed
  cpd00029_e0: 1.0        # acetate -- produced then partially cross-fed
  cpd00211_e0: 0.5        # butyrate -- terminal pool of the cross-feeding chain

# --- expected cross-feeding interactions ------------------------------------
# The key ecological signal: B. thetaiotaomicron ferments glucose -> acetate, which
# E. rectale uses as a co-substrate for butyrate synthesis; B. longum also feeds acetate
# into the pool (oligosaccharide -> acetate).  ModelSEED acetate is cpd00029_e0.
cross_feeding:
  - [B_thetaiotaomicron_VPI5482, cpd00029_e0, E_rectale_ATCC33656]
  - [B_longum_NCC2705, cpd00029_e0, E_rectale_ATCC33656]

# --- tolerances -------------------------------------------------------------
tolerances:
  abundance_mae: 0.15     # mean absolute error of relative abundance (0-1 scale)
  metabolite_mae: 5.0     # mmol/L — wide because model quality varies
  min_f1: 0.25            # at least 1 of the 2 expected cross-feeding edges detected
