# muODE pipeline config — 12-species western gut community example.
# Run from the repository root:
#   snakemake --use-conda --cores 8 --configfile examples/gut_western/config.yaml
#
# ENGINE: gapseq.  This example's payload is a BUTYRATE cross-feeding network, and
# CarveMe (BiGG universe) has no connected butyrate pathway for gut anaerobes, so the
# butyrate producers would carry no butyrate exchange and the whole point would collapse
# to a dial.  gapseq builds bottom-up from MetaCyc and secretes butyrate natively.  See
# gems/PROVENANCE.md.  gapseq needs its own env and does NOT run on aarch64.
#
# The committed GEMs are the reproducible artifact: build them once with
# gems/reconstruct_gapseq.sh (workstation), then the pipeline runs from gems/.  Only 3
# of 12 are committed so far (shared with fmt_cdiff); the other 9 are a workstation job.

# --- inputs / outputs -------------------------------------------------------
mags_dir: "examples/gut_western/data/mags"
mag_extension: "fna"
abundance: "examples/gut_western/abundance.tsv"
outdir: "examples/gut_western/results"

# --- Phase 0: MAG quality gate ----------------------------------------------
# These are complete reference genomes, not metagenomic bins — CheckM2 is not
# needed, but leave it in the pipeline (off) so the config mirrors production.
run_checkm2: false
min_completeness: 50.0
max_contamination: 10.0

# --- Phase 1: reconstruction ------------------------------------------------
engine: "gapseq"
universe: null          # a CarveMe concept; gapseq uses its own MetaCyc/ModelSEED DB
gapfill_media: null     # gapseq doall gap-fills on its own predicted medium (see PROVENANCE)

# --- Phase 2/3: refinement --------------------------------------------------
universal_model: null
run_memote: false
predict_kinetics: false
predictor: "heuristic"
enzyme_constraints: false
default_vmax: 10.0
default_km: 0.01

# --- Phase 4: simulation ----------------------------------------------------
# gapseq models are ModelSEED-native, so the diet must be too.  western_gut is
# translated BiGG->ModelSEED ONCE, from the models' own annotations, by
# derive_medium_modelseed.py -> gems/western_gut_modelseed.csv.  That file is a
# workstation output (it needs the 12 GEMs); it is generated, not committed.
diet: "examples/gut_western/gems/western_gut_modelseed.csv"
total_biomass: 0.01
t_end: 48.0
dt: 0.1

# --- abundance-aware subsampling --------------------------------------------
# drop genomes below 1% relative abundance (none in this example, but
# demonstrates the feature for larger community datasets)
max_species: null
min_abundance: 0.01
abundance_coverage: null

# --- Phase 6: validation ----------------------------------------------------
benchmark: "examples/gut_western/benchmark.yaml"

# --- compute ----------------------------------------------------------------
threads: 8

# --- Phase 5: perturbation (optional) ----------------------------------------
# Uncomment to add a keystone-species removal arm (see README for context):
# perturbation:
#   remove_species: "R_bromii_L263"
perturbation: null
