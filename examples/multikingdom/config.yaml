# muODE pipeline config -- multi-kingdom gut example (bacteria + fungus + phage).
# Run from the REPOSITORY ROOT so that `pip install .` in the conda envs finds
# the local muode package:
#
#   conda activate muode            # for run: blocks (select_mags, validate, ...)
#   pip install -e .                # editable install so imports resolve
#   snakemake --snakefile workflow/Snakefile \
#             --use-conda --cores 8 \
#             --configfile examples/multikingdom/config.yaml
#
# Domain-aware reconstruction (driven by `traits:` below):
#   bacteria / archaea  --> CarveMe  (workflow/envs/carveme.yaml)
#   eukaryote (fungus)  --> a curated model supplied via `eukaryote_models`.
#                          CarveMe and gapseq are PROKARYOTE tools: gapseq aborts
#                          on eukaryotic contigs (HMMER's hmmsearch has a 100 kb
#                          limit), so the fungus must come from a eukaryote-aware
#                          reconstructor (Yeast8 / CarveFungi). Without one it is
#                          skipped (a warning is printed).
#   virus (phage)       --> skipped  (no GEM -- add PhageInfection ecology
#                          layers in mechanistic_demo.py instead)

# --- inputs / outputs -------------------------------------------------------
mags_dir: "examples/multikingdom/data/mags"
mag_extension: "fna"
abundance: "examples/multikingdom/abundance.tsv"
traits: "examples/multikingdom/traits.tsv"   # per-MAG domain/oxygen side file
outdir: "examples/multikingdom/results"

# --- Phase 0: MAG quality gate ----------------------------------------------
run_checkm2: false
min_completeness: 50.0
max_contamination: 10.0

# --- Phase 1: reconstruction ------------------------------------------------
# gramneg covers the two bacteria (CarveMe -> BiGG).  The fungus is NOT reconstructed
# from a genome: it uses a curated model (below), which beats a CarveFungi draft and
# needs no MetaEuk/CarveFungi tooling.  The phage has no GEM and is always skipped.
engine: "carveme"
universe: "gramneg"
gapfill_media: null

# The fungus is S. cerevisiae via Yeast8 -- the gold-standard curated fungal GEM, and a
# real gut-resident yeast (S. boulardii, a probiotic, is a strain of it).  C. albicans
# would be more gut-native but has no comparably curated model.  Yeast8 is BiGG-namespace
# once its exchanges are harmonized (harmonize_fungal_gem.py), so it shares the pool with
# the CarveMe bacteria.  Build it (both steps run locally, gapseq/CarveFungi not needed):
#   bash   examples/multikingdom/fetch_yeast8.sh
#   python examples/multikingdom/harmonize_fungal_gem.py \
#       --in examples/multikingdom/data/yeast-GEM.xml \
#       --out examples/multikingdom/data/eukaryote_models/S_cerevisiae_bigg.xml.gz
eukaryote_models:
  S_cerevisiae: "examples/multikingdom/data/eukaryote_models/S_cerevisiae_bigg.xml.gz"

# The CarveFungi / generic-eukaryote route is left available but unused here (curated
# model wins).  euk_ref_db enables it; carvefungi_cmd / eggnog_data_dir tune it.
euk_ref_db: null
carvefungi_cmd: null
eggnog_data_dir: null

# --- Phase 2/3: refinement --------------------------------------------------
universal_model: null
run_memote: false
predict_kinetics: false
predictor: "heuristic"
enzyme_constraints: false
default_vmax: 10.0
default_km: 0.01

# --- Phase 4: simulation ----------------------------------------------------
# A DEFINED AEROBIC medium (glucose + a mucosal O2 trickle + salts): this example needs
# O2 for the fungus to scavenge, and muODE's western_gut preset is anaerobic.  All BiGG,
# so it feeds the CarveMe bacteria and the harmonized fungus from one pool.  Verified: it
# grows the fungus at ~0.47/h (0 without O2).  The OxygenSensitivity and PhageInfection
# layers are configured in code (they need per-organism traits / a phage host).
diet: "examples/multikingdom/mucosal_aerobic.csv"
total_biomass: 0.03
t_end: 36.0
dt: 0.05

# --- abundance-aware subsampling --------------------------------------------
max_species: null
min_abundance: null
abundance_coverage: null

# --- compute ----------------------------------------------------------------
threads: 8
perturbation: null
