# muODE pipeline config -- multi-kingdom gut example (bacteria + fungus + phage).
# Run from the REPOSITORY ROOT so that `pip install .` in the conda envs finds
# the local muode package:
#
#   conda activate muode            # for run: blocks (select_mags, validate, ...)
#   pip install -e .                # editable install so imports resolve
#   snakemake --snakefile workflow/Snakefile \
#             --use-conda --cores 8 \
#             --configfile examples/multikingdom/config.yaml
#
# Domain-aware reconstruction (driven by `traits:` below):
#   bacteria / archaea  --> CarveMe  (workflow/envs/carveme.yaml)
#   eukaryote (fungus)  --> a curated model supplied via `eukaryote_models`.
#                          CarveMe and gapseq are PROKARYOTE tools: gapseq aborts
#                          on eukaryotic contigs (HMMER's hmmsearch has a 100 kb
#                          limit), so the fungus must come from a eukaryote-aware
#                          reconstructor (Yeast8 / CarveFungi). Without one it is
#                          skipped (a warning is printed).
#   virus (phage)       --> skipped  (no GEM -- add PhageInfection ecology
#                          layers in mechanistic_demo.py instead)

# --- inputs / outputs -------------------------------------------------------
mags_dir: "examples/multikingdom/data/mags"
mag_extension: "fna"
abundance: "examples/multikingdom/abundance.tsv"
traits: "examples/multikingdom/traits.tsv"   # per-MAG domain/oxygen side file
outdir: "examples/multikingdom/results"

# --- Phase 0: MAG quality gate ----------------------------------------------
run_checkm2: false
min_completeness: 50.0
max_contamination: 10.0

# --- Phase 1: reconstruction ------------------------------------------------
# gramneg covers the two bacteria. C_albicans (domain 'fungus' in traits.tsv)
# reconstructs automatically via MetaEuk + CarveFungi once `euk_ref_db` is set
# below; until then it is skipped. The phage has no GEM and is always skipped.
engine: "carveme"
universe: "gramneg"
gapfill_media: null

# Automated eukaryote reconstruction (fungus -> CarveFungi, eukaryote -> generic).
# MetaEuk gene calling needs a protein reference database (MMseqs2/MetaEuk format,
# e.g. a UniRef90 or curated-eukaryote DB). Set this to enable the fungus route:
#   euk_ref_db: "/path/to/metaeuk/refdb"
euk_ref_db: null
# Optional: override the CarveFungi invocation ({proteins}/{output}/{threads}).
#   carvefungi_cmd: "python /opt/CarveFungi/carvefungi.py {proteins} -o {output}"
carvefungi_cmd: null
# Optional: eggNOG-mapper data directory for the generic (non-fungal) euk route.
eggnog_data_dir: null

# Curated eukaryote GEMs (mag_id -> SBML path) override automated reconstruction.
# Point here at a model from any eukaryote-aware reconstructor (Yeast8 template,
# CarveFungi run by hand, ...), e.g.:
#   eukaryote_models:
#     C_albicans: "examples/multikingdom/data/eukaryote_models/C_albicans.xml"
eukaryote_models: {}

# --- Phase 2/3: refinement --------------------------------------------------
universal_model: null
run_memote: false
predict_kinetics: false
predictor: "heuristic"
enzyme_constraints: false
default_vmax: 10.0
default_km: 0.01

# --- Phase 4: simulation ----------------------------------------------------
# Carbon plus a steady oxygen trickle from the mucosa; the OxygenSensitivity and
# PhageInfection layers are configured in code (mechanistic_demo.py) since they
# need per-organism traits / a phage host.
diet: "western_gut"
total_biomass: 0.03
t_end: 36.0
dt: 0.05

# --- abundance-aware subsampling --------------------------------------------
max_species: null
min_abundance: null
abundance_coverage: null

# --- compute ----------------------------------------------------------------
threads: 8
perturbation: null
