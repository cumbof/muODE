# Alternative reconstruction engine (Phase 1, optional). ModelSEED namespace --
# do NOT mix gapseq and CarveMe models in one community.
# Also used for eukaryote MAGs when domain-aware routing is active (gapseq has
# limited fungi/protist pathway coverage; better than nothing pending dedicated
# fungal tools such as CarveFungi or the Yeast8 template).
# Python + muode are included so that workflow/scripts/reconstruct_one.py runs
# inside this env without needing the base muode env to be active.
name: muode-gapseq
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - gapseq>=1.3
  - pip
  - pip:
    - .  # install muode from the repo root (snakemake must be run from there)
