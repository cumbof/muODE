# Example SLURM profile for large MAG sets.
# Usage: snakemake --workflow-profile workflow/profiles/slurm --use-conda
#
# Requires the snakemake-executor-plugin-slurm plugin:
#   pip install snakemake-executor-plugin-slurm

executor: slurm
jobs: 200                      # max concurrently submitted jobs
use-conda: true
rerun-incomplete: true
keep-going: true

default-resources:
  slurm_partition: "normal"
  mem_mb: 8000
  runtime: 120                 # minutes

# Per-rule resource overrides: reconstruction is light, simulation of a large
# community is memory- and solver-heavy.
set-resources:
  checkm2:
    mem_mb: 32000
    runtime: 240
  reconstruct:
    mem_mb: 4000
    runtime: 60
  refine:
    mem_mb: 8000
    runtime: 60
  simulate:
    mem_mb: 32000
    runtime: 720
  perturb:
    mem_mb: 32000
    runtime: 720

set-threads:
  checkm2: 16
  reconstruct: 4
